services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campaign_manager}
      POSTGRES_USER: ${POSTGRES_USER:-campaign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campaign}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@db:5432/${POSTGRES_DB:-campaign_manager}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: ${PORT:-4000}
      SEED: ${SEED:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$PORT/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${PORT:-4000}:4000"
    command: >-
      sh -c "yarn workspace @campaign/db migrate &&
      if [ \"$$SEED\" = \"true\" ]; then yarn workspace @campaign/db seed; fi &&
      yarn workspace @campaign/api start:docker"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_PROXY_TARGET: http://api:4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$$FRONTEND_PORT >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command: >-
      sh -c "yarn workspace @campaign/frontend dev --host 0.0.0.0 --port $$FRONTEND_PORT"

volumes:
  db-data:
